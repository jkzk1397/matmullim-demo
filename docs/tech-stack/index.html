<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Tech Stack</title>
<style>
  @font-face { font-family: 'Pretendard'; src: url('../../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1600px; height: 900px; background: #fff; font-family: 'Pretendard', sans-serif; color: #212529; padding: 64px 80px; display: flex; flex-direction: column; }
  h1 { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 56px; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 1fr; gap: 48px 32px; }
  fieldset { border: 2px solid #d0d5dc; border-radius: 20px; padding: 24px 24px 32px; display: flex; align-items: center; justify-content: space-evenly; min-width: 0; }
  legend { padding: 0 14px; margin-left: 16px; font-size: 26px; font-weight: 800; color: #212529; }
  .t { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .t img { height: 84px; width: 84px; object-fit: contain; }
  .t img.word { width: 140px; }
  .t b { font-size: 21px; font-weight: 700; color: #343a40; }
  .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s3 { grid-column: span 3; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; }
</style>
</head>
<body>
  <h1>Tech Stack</h1>
  <div class="grid" id="grid">
    <fieldset class="s7"><legend>Frontend</legend>
      <div class="t"><img src="logos/react-original.svg" alt="" /><b>React</b></div>
      <div class="t"><img src="logos/typescript-original.svg" alt="" /><b>TypeScript</b></div>
      <div class="t"><img src="logos/vitejs-original.svg" alt="" /><b>Vite</b></div>
      <div class="t"><img src="logos/tailwindcss-original.svg" alt="" /><b>Tailwind CSS</b></div>
    </fieldset>
    <fieldset class="s5" id="doc"><legend>Testing</legend>
      <div class="t"><img src="logos/vitest-original.svg" alt="" /><b>Vitest</b></div>
      <div class="t"><img src="logos/playwright-original.svg" alt="" /><b>Playwright</b></div>
    </fieldset>
    <fieldset class="s7"><legend>CI/CD</legend>
      <div class="t"><img src="logos/nodejs-original.svg" alt="" /><b>Node.js</b></div>
      <div class="t"><img class="word" src="logos/npm-original-wordmark.svg" alt="" /><b>npm</b></div>
      <div class="t"><img src="logos/github-original.svg" alt="" /><b>GitHub</b></div>
      <div class="t"><img src="logos/githubactions-original.svg" alt="" /><b>GitHub Actions</b></div>
    </fieldset>
    <fieldset class="s5"><legend>AI</legend>
      <div class="t"><img src="logos/claude.svg" alt="" /><b>Claude Code</b></div>
    </fieldset>
  </div>
  <script>
    // logos/hangul.(svg|png)이 있으면 Document 칸(한글 HWPX)을 넣는다
    (async () => {
      for (const ext of ['svg', 'png']) {
        const ok = await new Promise((r) => { const i = new Image(); i.onload = () => r(true); i.onerror = () => r(false); i.src = `logos/hangul.${ext}`; });
        if (!ok) continue;
        const grid = document.getElementById('grid');
        grid.children[1].className = 's3';
        grid.children[0].className = 's6';
        const f = document.createElement('fieldset');
        f.className = 's3';
        f.innerHTML = `<legend>Document</legend><div class="t"><img src="logos/hangul.${ext}" alt="" /><b>한글 (HWPX)</b></div>`;
        grid.insertBefore(f, grid.children[1]);
        grid.children[3].className = 's7'; grid.children[4].className = 's5';
        break;
      }
      document.body.dataset.ready = '1';
    })();
  </script>
</body>
</html>
