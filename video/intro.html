<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>맞물림 소개 영상</title>
<style>
  @font-face { font-family: 'P'; src: url('../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2'); font-weight: 100 900; }
  :root { --navy:#0d2b57; --green:#2b8a3e; --red:#d7263d; --ink:#1b1f24; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: 'P', sans-serif; letter-spacing: -0.03em; word-break: keep-all; background: #e9eef5; }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .center { left: 0; right: 0; text-align: center; }
  /* 화면 틀은 고정, 안쪽 내용만 강조할 때 살짝 확대했다가 전체로 돌아온다 */
  #view { position: absolute; left: 160px; top: 24px; width: 1600px; height: 900px; overflow: hidden; border-radius: 16px; background: #fff; box-shadow: 0 24px 60px -24px rgba(13,43,87,.35), 0 0 0 1px rgba(13,43,87,.08); }
  #inner { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  #inner img { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
  #marks { position: absolute; left: 0; top: 0; }
  .hl { mix-blend-mode: multiply; }
  #cap { position: absolute; left: 0; right: 0; top: 952px; height: 100px; display: flex; align-items: center; justify-content: center; gap: 20px; }
  #capNum { width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 30px; font-weight: 800; display: flex; align-items: center; justify-content: center; letter-spacing: 0; }
  .chip { display: inline-block; padding: 18px 36px; border: 3px solid var(--navy); border-radius: 999px; font-size: 48px; font-weight: 700; color: var(--navy); background: #fff; }
  #capText { font-size: 44px; font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
  <div class="layer" id="app">
    <div id="view">
      <div id="inner">
        <img id="imgA" src="demo/1-upload.png" />
        <img id="imgB" src="demo/1-upload.png" />
        <svg id="marks" width="1600" height="900" viewBox="0 0 1600 900"></svg>
      </div>
    </div>
    <div id="cap"><div id="capNum">1</div><div id="capText"></div></div>
    <svg class="abs" id="cur" width="48" height="48" viewBox="0 0 24 24" style="left:0;top:0"><path d="M5 3l14 8-6 1.5L10 19z" fill="#1b1f24" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <div class="abs" id="clickRing" style="left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid rgba(13,43,87,.6)"></div>
  </div>

  <!-- 시작: 질문으로 여는 한 장면 -->
  <div class="layer" id="intro" style="background:#fff">
    <div class="abs center" id="i0" style="top:390px;font-size:84px;font-weight:800;color:var(--navy)"><span id="w1">교육과정,</span> <span id="w2">수업,</span> <span id="w3">평가.</span></div>
    <div class="abs center" id="i2" style="top:530px;font-size:84px;font-weight:800;color:var(--ink)">서로 <span style="color:var(--green)">맞물리나요?</span></div>
    <!-- 질문에 대한 답: 무엇을 맞춰 보는지 -->
    <div class="abs center" id="b1" style="top:400px;display:flex;justify-content:center;gap:28px">
      <span class="chip" id="c1">성취기준</span><span class="chip" id="c2">배점</span><span class="chip" id="c3">채점기준</span><span class="chip" id="c4">교육청 지침</span>
    </div>
    <div class="abs center" id="b2" style="top:560px;font-size:64px;font-weight:800;color:var(--ink)">문서끼리 <span style="color:var(--green)">하나하나 맞춰 봅니다</span></div>
  </div>

  <!-- 끝 -->
  <div class="layer" id="end" style="background:#fff">
    <img class="abs" id="eLogo" src="logo.png" style="left:840px;top:240px;width:240px;height:240px" />
    <div class="abs center" id="eName" style="top:520px;font-size:120px;font-weight:800;color:var(--navy);letter-spacing:-0.04em">맞물림</div>
    <div class="abs center" id="eLine" style="top:720px;font-size:46px;font-weight:600;color:#3a4350">교육과정, 수업, 평가가 <span style="color:var(--green)">제대로 맞물렸는지</span> 확인합니다</div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;
const fadeUp = (el, t, a, d = 0.7, dy = 24) => {
  const e = outCubic(prog(t, a, a + d));
  el.style.opacity = e;
  el.style.transform = `translateY(${lerp(dy, 0, e)}px)`;
};

// 장면: 화면, 자막, 확대(강조할 때만, 끝나면 전체 화면으로), 표시(형광펜·동그라미·화살표·밑줄), 커서
// 좌표는 모두 1600×900 앱 화면 기준
const FULL = { fx: 800, fy: 450, z: 1 };
const SCENES = [
  { a: 3.0, b: 7.9, img: '1-upload', n: 1, cap: '점검할 문서를 올립니다',
    marks: [{ k: 'hl', at: 4.6, x: 256, y: 488, w: 170, h: 30 }],
    cursor: { from: [1500, 880], to: [1348, 516], a: 5.4, b: 6.5, click: 6.9 } },
  { a: 7.5, b: 14.7, img: '2-confirm', n: 2, cap: '읽어 낸 값을 원문과 나란히 확인합니다',
    zoom: { at: 8.6, out: 12.4, cam: { fx: 1000, fy: 450, z: 1.4 } },
    marks: [
      { k: 'ring', at: 9.9, x: 690, y: 480, w: 86, h: 45, col: '#d7263d' },
      { k: 'arrow', at: 10.6, p: [[780, 500], [1060, 500], [1270, 404]], col: '#d7263d' },
      { k: 'ring', at: 11.3, x: 1274, y: 368, w: 132, h: 46, col: '#d7263d' },
    ],
    cursor: { from: [1560, 880], to: [1354, 860], a: 13.0, b: 13.8, click: 14.1 } },
  { a: 14.3, b: 21.1, img: '3-results', n: 3, cap: '문서끼리 어긋난 곳을 근거와 함께 보여 줍니다',
    zoom: { at: 15.4, out: 19.6, cam: { fx: 982, fy: 430, z: 1.35 } },
    marks: [
      { k: 'ring', at: 16.6, x: 866, y: 323, w: 84, h: 32, col: '#d7263d' },
      { k: 'ring', at: 17.2, x: 1330, y: 476, w: 56, h: 32, col: '#d7263d' },
      { k: 'line', at: 18.0, x: 644, y: 622, w: 540, col: '#0b5cad' },
    ] },
  { a: 20.7, b: 26.3, img: '4-map', n: 4, cap: '빠진 연결은 선생님이 직접 정합니다', swap: { at: 23.6, img: '5-map-linked' },
    marks: [
      { k: 'hl', at: 21.7, x: 196, y: 626, w: 98, h: 30, until: 23.6 },
      { k: 'ring', at: 24.1, x: 1144, y: 618, w: 48, h: 44, col: '#2b8a3e' },
      { k: 'hl', at: 24.7, x: 1076, y: 130, w: 346, h: 28, col: 'rgba(120,220,140,.45)' },
    ],
    cursor: { from: [1500, 880], to: [808, 640], a: 22.2, b: 23.1, click: 23.4 } },
  { a: 25.9, b: 31.3, img: '6-recheck', n: 5, cap: '고친 문서를 다시 올리면, 해결됐는지 비교합니다',
    zoom: { at: 26.9, out: 29.9, cam: { fx: 600, fy: 300, z: 1.4 } },
    marks: [
      { k: 'hl', at: 27.9, x: 284, y: 150, w: 112, h: 36, col: 'rgba(120,220,140,.5)' },
      { k: 'ring', at: 28.5, x: 600, y: 170, w: 90, h: 44, col: '#2b8a3e' },
    ] },
];

function camOf(s, t) {
  if (!s.zoom) return FULL;
  const { at, out, cam } = s.zoom;
  const e = t < out ? ease(prog(t, at, at + 1.0)) : 1 - ease(prog(t, out, out + 1.0));
  const z = lerp(1, cam.z, e);
  const hx = 800 / z, hy = 450 / z;
  return { fx: clamp(lerp(800, cam.fx, e), hx, 1600 - hx), fy: clamp(lerp(450, cam.fy, e), hy, 900 - hy), z };
}
const toScreen = (c, x, y) => [160 + 800 + (x - c.fx) * c.z, 24 + 450 + (y - c.fy) * c.z];

function markSvg(m, t, o) {
  const p = prog(t, m.at, m.at + 0.6);
  if (p <= 0) return '';
  const op = o * (m.until ? 1 - prog(t, m.until, m.until + 0.3) : 1);
  if (m.k === 'hl') {
    return `<rect class="hl" x="${m.x}" y="${m.y}" width="${m.w * outCubic(p)}" height="${m.h}" rx="4" fill="${m.col || 'rgba(255,214,0,.55)'}" opacity="${op}"/>`;
  }
  if (m.k === 'line') {
    return `<path d="M${m.x} ${m.y} L${m.x + m.w * outCubic(p)} ${m.y}" stroke="${m.col}" stroke-width="4" stroke-linecap="round" fill="none" opacity="${op}"/>`;
  }
  if (m.k === 'ring') {
    // 손으로 한 바퀴 두른 듯한 동그라미
    const cx = m.x + m.w / 2, cy = m.y + m.h / 2, rx = m.w / 2 + 8, ry = m.h / 2 + 6;
    const len = Math.PI * (rx + ry) * 1.3;
    const d = `M${cx - rx * 0.2} ${cy - ry} C${cx + rx * 1.1} ${cy - ry * 1.05}, ${cx + rx * 1.08} ${cy + ry * 1.05}, ${cx} ${cy + ry} S${cx - rx * 1.08} ${cy - ry * 0.9}, ${cx + rx * 0.15} ${cy - ry * 1.08}`;
    return `<path d="${d}" stroke="${m.col}" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - outCubic(p))}" opacity="${op}"/>`;
  }
  if (m.k === 'arrow') {
    const [[x0, y0], [cx, cy], [x1, y1]] = m.p;
    const len = 800;
    const ah = prog(t, m.at + 0.45, m.at + 0.65);
    const ang = Math.atan2(y1 - cy, x1 - cx), h = 18;
    const a1 = [x1 - h * Math.cos(ang - 0.5), y1 - h * Math.sin(ang - 0.5)], a2 = [x1 - h * Math.cos(ang + 0.5), y1 - h * Math.sin(ang + 0.5)];
    return `<path d="M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}" stroke="${m.col}" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - outCubic(p))}" opacity="${op}"/>` +
      `<path d="M${a1[0]} ${a1[1]} L${x1} ${y1} L${a2[0]} ${a2[1]}" stroke="${m.col}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="${op * ah}"/>`;
  }
  return '';
}

const setImg = (img, name) => { if (!img.src.endsWith(`/${name}.png`)) img.src = `demo/${name}.png`; };
const imgOf = (s, t) => (s.swap && t >= s.swap.at ? s.swap.img : s.img);

window.render = (t0) => {
  // 0~2.9초 질문 → 3.2~5.2초 무엇을 맞춰 보는지 → 5.6초부터 앱 화면(시각표 3초 = 영상 5.6초)
  // 겹친 투명도 때문에 잔상이 생기지 않도록 배경과 글자의 투명도를 따로 계산한다
  const bgA = 1 - prog(t0, 5.3, 5.8);
  $('intro').style.opacity = 1;
  $('intro').style.background = `rgba(255,255,255,${bgA})`;
  $('intro').style.display = bgA > 0 ? 'block' : 'none';
  const qOut = 1 - prog(t0, 2.7, 3.1);
  [['w1', 0.2], ['w2', 0.6], ['w3', 1.0]].forEach(([id, a]) => {
    $(id).style.display = 'inline-block';
    $(id).style.opacity = outCubic(prog(t0, a, a + 0.6)) * qOut;
  });
  fadeUp($('i2'), t0, 1.7, 0.8);
  $('i2').style.opacity *= qOut;
  const bOut = 1 - prog(t0, 5.0, 5.35);
  [['c1', 3.3], ['c2', 3.55], ['c3', 3.8], ['c4', 4.05]].forEach(([id, a]) => {
    fadeUp($(id), t0, a, 0.6, 20);
    $(id).style.opacity *= bOut;
  });
  fadeUp($('b2'), t0, 4.4, 0.7, 20);
  $('b2').style.opacity *= bOut;
  // 투명도 0인 글자는 아예 숨긴다(남은 레이어가 옅은 네모로 비치지 않게)
  ['i0', 'w1', 'w2', 'w3', 'i2', 'c1', 'c2', 'c3', 'c4', 'b2'].forEach((id) => {
    const el = $(id);
    el.style.visibility = id === 'i0' ? (qOut > 0 ? 'visible' : 'hidden') : +el.style.opacity > 0.001 ? 'visible' : 'hidden';
  });
  const t = t0 - 2.6;
  const appIn = outCubic(prog(t, 3.0, 3.8));
  $('view').style.opacity = appIn;
  $('view').style.transform = `translateY(${lerp(30, 0, appIn)}px)`;

  // 엔딩: 로고와 이름이 나타난 뒤 그대로 멈춤
  const endO = prog(t, 31.0, 31.6);
  $('end').style.opacity = endO;
  $('end').style.display = endO > 0 ? 'block' : 'none';
  fadeUp($('eLogo'), t, 31.6, 0.9, 30);
  fadeUp($('eName'), t, 32.3, 0.9, 30);
  fadeUp($('eLine'), t, 33.1, 0.9, 20);

  const live = SCENES.filter((s) => t >= s.a && t < s.b);
  if (!live.length) { $('cap').style.opacity = 0; $('cur').style.opacity = 0; $('clickRing').style.opacity = 0; return; }
  const s = live[live.length - 1];
  const prev = live.length > 1 ? live[0] : null;
  const k = prev ? ease(prog(t, s.a, prev.b)) : 1;
  if (prev) {
    setImg($('imgA'), imgOf(prev, t)); setImg($('imgB'), imgOf(s, t));
    $('imgB').style.opacity = k;
  } else if (s.swap) {
    const sw = prog(t, s.swap.at, s.swap.at + 0.3);
    setImg($('imgA'), s.img); setImg($('imgB'), s.swap.img);
    $('imgB').style.opacity = sw;
  } else {
    setImg($('imgB'), s.img); $('imgB').style.opacity = 1;
  }

  const c = camOf(prev ? prev : s, t);
  $('inner').style.transform = `translate(${800 - c.fx * c.z}px, ${450 - c.fy * c.z}px) scale(${c.z})`;
  $('marks').innerHTML = prev
    ? (prev.marks || []).map((m) => markSvg(m, t, 1 - k)).join('')
    : (s.marks || []).map((m) => markSvg(m, t, 1)).join('');

  // 자막: 장면이 바뀔 때만 조용히 교체
  const capS = SCENES.filter((x) => t >= x.a + 0.3).pop() || SCENES[0];
  const ce = outCubic(prog(t, capS.a + 0.3, capS.a + 0.9));
  const capOut = 1 - prog(t, 30.6, 31.0);
  $('capNum').textContent = capS.n;
  $('capText').textContent = capS.cap;
  $('cap').style.opacity = ce * appIn * capOut;
  $('cap').style.transform = `translateY(${lerp(14, 0, ce)}px)`;

  const cs = SCENES.find((x) => x.cursor && t >= x.cursor.a - 0.3 && t < x.cursor.click + 0.6);
  if (cs) {
    const m = cs.cursor;
    const tgt = toScreen(camOf(cs, t), m.to[0], m.to[1]);
    const e = ease(prog(t, m.a, m.b));
    const x = lerp(m.from[0] + 160, tgt[0], e), y = lerp(m.from[1] + 24, tgt[1], e);
    const press = 1 - 0.12 * Math.sin(Math.PI * prog(t, m.click - 0.08, m.click + 0.08));
    $('cur').style.opacity = prog(t, m.a - 0.3, m.a) * (1 - prog(t, m.click + 0.35, m.click + 0.6));
    $('cur').style.transform = `translate(${x - 9}px,${y - 6}px) scale(${press})`;
    const r = prog(t, m.click, m.click + 0.5);
    $('clickRing').style.opacity = r > 0 && r < 1 ? 1 - r : 0;
    $('clickRing').style.transform = `translate(${x}px,${y}px) scale(${lerp(0.4, 1.3, outCubic(r))})`;
  } else { $('cur').style.opacity = 0; $('clickRing').style.opacity = 0; }
};

const imgs = ['1-upload', '2-confirm', '3-results', '4-map', '5-map-linked', '6-recheck'].map((n) => { const i = new Image(); i.src = `demo/${n}.png`; return i; });
window.ready = Promise.all([document.fonts.ready, ...imgs.map((i) => (i.complete ? 1 : new Promise((r) => (i.onload = r)))), ...[...document.images].map((i) => (i.complete ? 1 : new Promise((r) => (i.onload = r))))]);
window.render(0);
</script>
</body>
</html>
